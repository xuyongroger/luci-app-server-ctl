#
# luci-app-server-ctl —— 用 GitHub Actions 云端编译单个 OpenWrt/ImmortalWrt LuCI 插件
#
# 思路说明：
#   参考仓库 My-ImmortalWrt 走的是“全固件编译”（克隆整棵 ImmortalWrt 源码树再 make -j，
#   产出整个固件镜像）。但本仓库只是一个单独的 LuCI 应用包，不需要编整台路由器的固件。
#   编译单个插件的官方推荐工具是 OpenWrt/ImmortalWrt 的 SDK（专为此设计，几分钟即可产出 .ipk）。
#
#   注意：本包 Makefile 使用 `include ../../luci.mk`，这要求包目录位于 luci feed 的
#   applications/ 这一层，相对路径才能解析到 luci.mk。因此本工作流先更新 feeds，再把
#   luci-app-server-ctl 复制进 feeds/luci/applications/ 下，然后软链接进 package/feeds/luci
#   让 buildroot 识别它。
#
#   重要：编译本包会连带编译 luci-base 及其 C 依赖(rpcd-mod-luci、lucihttp 等)，它们需要
#   libnl-tiny/liblua/libiwinfo 等 core 包的源码来补齐 staging 头。SDK 只预编译不附带这些
#   core 源码，因此必须同时 update 并 install `base` feed(feeds.conf 中的 src-git-full base)。
#
# 触发方式：
#   - Actions 页面手动 Run workflow（workflow_dispatch），可填写参数
#   - repository_dispatch（外部 API 触发，仅响应 types: build 事件）
#
# 产出：
#   - Actions Artifacts：luci-app-server-ctl_*.ipk
#   - 可选：勾选 upload_release 后会创建一个 Release 并附上 .ipk
#

name: Build luci-app-server-ctl

on:
  repository_dispatch:
    # 显式限定事件类型，避免任意外部 dispatch 都能触发构建
    types:
      - build
  workflow_dispatch:
    inputs:
      iw_version:
        description: 'ImmortalWrt 版本（用于选择 SDK，例如 24.10.6 / 25.12.2）'
        required: false
        default: '24.10.6'
      upload_release:
        description: '是否创建 Release 并上传 .ipk（true/false）'
        required: false
        default: 'false'
      ssh:
        description: '开启 SSH 远程调试 Actions（true/false）'
        required: false
        default: 'false'

env:
  # ImmortalWrt 官方下载镜像的 releases 根目录
  IW_MIRROR: https://downloads.immortalwrt.org/releases
  # 用作 fallback，若手动运行未填 iw_version 时使用；手动运行以输入框为准
  IW_VERSION_DEFAULT: 24.10.6
  # SDK 的目标平台。SDK 是 x86_64 的，但 LuCI 应用 PKGARCH:=all，产出的 ipk 通用于各平台
  IW_TARGET: x86/64
  PKG_NAME: luci-app-server-ctl
  # 简体中文翻译为独立 i18n 包(po/zh_Hans -> 包名后缀 zh-cn)
  I18N_PKG: luci-i18n-server-ctl-zh-cn
  TZ: Asia/Shanghai

permissions:
  # 最小权限原则：build job 只需只读仓库内容；创建 Release 所需的
  # contents: write 由独立的 release job 单独持有（见文件末尾）。
  contents: read

jobs:
  build:
    # runner 镜像：ubuntu-22.04 已过 GitHub 托管退役期，改用 24.04；
    # 注意 24.04 的 apt 源不再提供 python3-distutils（Python 3.12 移除了 distutils），
    # 若保留该包名 apt 安装会直接失败。
    runs-on: ubuntu-24.04

    # 供 release job 使用：SDK 版本(拼产物名)、构建号(写 Release 正文)、ipk 是否产出
    outputs:
      version: ${{ steps.ver.outputs.version }}
      build_id: ${{ steps.buildid.outputs.build_id }}
      ipk_ok: ${{ steps.collect.outputs.status }}

    steps:
      - name: Checkout
        # actions 钉到 commit SHA（供应链加固），行尾注释标注对应版本；
        # 升级时由 dependabot（见 .github/dependabot.yml）提 PR 同步更新。
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Resolve version
        id: ver
        run: |
          echo "version=${{ github.event.inputs.iw_version || env.IW_VERSION_DEFAULT }}" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # 注意：ubuntu-24.04 的主源是 deb822 格式的 /etc/apt/sources.list.d/ubuntu.sources，
          # 不能像 22.04 那样整目录清空 sources.list.d/*，否则主源被删、apt 全装不上。
          # 这里只删第三方源文件(dotnet/azure 等)，保留 ubuntu.sources。
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f ! -name 'ubuntu.sources' -delete
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libncursesw5-dev libssl-dev \
            python3 python3-setuptools python3-pip rsync swig \
            unzip zlib1g-dev file wget curl ca-certificates zstd time subversion \
            libelf-dev cmake meson ninja-build pkg-config libjson-c-dev
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "$TZ"
          # 在更大盘符上工作，避免默认盘空间不足
          sudo mkdir -p /workdir
          sudo chown "$USER":"$GROUPS" /workdir

      - name: Run repo self-tests
        # 编译 SDK 前先跑仓库自带测试（tests/run-tests.sh：静态检查 + ucode/uci 行为测试）。
        # runner 自带 node；uci/ucode 在 Ubuntu 官方源中均不存在（都是 OpenWrt 组件），
        # 且被测 core.uc 用到 ucode 的 uci 模块，故按依赖链从上游源码快速构建(约 2 分钟)：
        #   libubox -> uci(uci CLI + libuci) -> ucode
        # （uci 关闭 Lua 绑定 BUILD_LUA=OFF；ucode 的 uci 模块链接需要 libubox+libuci）
        # ucode 的 cmake 检测到 libuci+libubox 后启用 UCI_SUPPORT；其模块搜索路径是
        # 编译期写死的 ${CMAKE_INSTALL_PREFIX}/lib/ucode，故三者统一 cmake --install
        # 到 /usr/local（模块 .so 落 /usr/local/lib/ucode），随后 ldconfig 刷新。
        # 装不上则脚本内断言失败，但整步不阻断 .ipk 产出
        # （continue-on-error，问题在步骤上以红色标示可查）。脚本会向 /usr/share、
        # /usr/local/bin 部署被测文件，故以 root 运行并透传 PATH 以便找到 node/ucode。
        continue-on-error: true
        shell: bash
        run: |
          [ -f /usr/local/lib/libubox.so ] || {
            git clone --depth 1 https://github.com/openwrt/libubox.git /tmp/libubox-src
            cmake -S /tmp/libubox-src -B /tmp/libubox-build -DCMAKE_BUILD_TYPE=Release -DBUILD_LUA=OFF
            cmake --build /tmp/libubox-build -j"$(nproc)"
            sudo cmake --install /tmp/libubox-build
          }
          command -v uci >/dev/null || {
            git clone --depth 1 https://github.com/openwrt/uci.git /tmp/uci-src
            # BUILD_LUA=OFF：Lua 绑定在 Ubuntu 上找不到 lua5.1 且测试用不到
            cmake -S /tmp/uci-src -B /tmp/uci-build -DCMAKE_BUILD_TYPE=Release -DBUILD_LUA=OFF
            cmake --build /tmp/uci-build -j"$(nproc)"
            sudo cmake --install /tmp/uci-build
          }
          sudo ldconfig
          command -v ucode >/dev/null || {
            git clone --depth 1 https://github.com/ucode-lang/ucode.git /tmp/ucode-src
            cmake -S /tmp/ucode-src -B /tmp/ucode-build \
              -DCMAKE_BUILD_TYPE=Release -DFS_SUPPORT=ON -DUCI_SUPPORT=ON
            cmake --build /tmp/ucode-build -j"$(nproc)"
            sudo cmake --install /tmp/ucode-build
          }
          ucode -e 'import { cursor } from "uci";' && echo "ucode uci 模块可用"
          sudo env PATH="$PATH" bash tests/run-tests.sh

      - name: Resolve build version
        id: buildid
        run: |
          # 构建号 = 编译时间 + 本次 checkout 的 commit 短哈希，注入 PKG_VERSION，
          # 使产出的 ipk 文件名可区分新旧（luci-app-server-ctl_<构建号>_all.ipk）。
          BUILD_ID="$(date +%Y.%m.%d%H%M)-$(git rev-parse --short=7 HEAD)"
          echo "BUILD_ID=$BUILD_ID" >> "$GITHUB_ENV"
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"

      - name: Download & unpack ImmortalWrt SDK
        working-directory: /workdir
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          BASE="${IW_MIRROR}/${VERSION}/targets/${IW_TARGET}"
          echo "Detecting SDK at: $BASE"
          # 从目录列表里抓取 SDK 文件名（不同版本 gcc / 压缩格式会变化）
          SDK_FILE=$(curl -fsSL "$BASE/" | grep -oE 'immortalwrt-sdk-[^"<> ]+\.Linux-x86_64\.tar\.(xz|zst|gz)' | sort -u | head -n1)
          if [ -z "$SDK_FILE" ]; then
            echo "::error::未能自动找到 SDK 文件，请检查 IW_VERSION 是否正确"
            exit 1
          fi
          echo "Found SDK: $SDK_FILE"
          curl -fsSL -o sdk.tar "$BASE/$SDK_FILE"
          tar -xf sdk.tar
          rm -f sdk.tar
          SDK_ROOT=$(find "$PWD" -maxdepth 1 -type d -name 'immortalwrt-sdk-*' | head -n1)
          echo "SDK_ROOT=$SDK_ROOT"
          echo "SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          df -hT "$PWD"

      - name: Update feeds
        run: |
          cd "$SDK_ROOT"
          [ -f feeds.conf.default ] && cp feeds.conf.default feeds.conf || true
          # 需要 base(提供 rpcd/libnl-tiny/liblua/libiwinfo/ucode 等 core 源码)、
          # packages、luci 三个 feed。缺 base 时 SDK 不附带这些 core 源码，
          # 会导致 rpcd-mod-luci/lucihttp 编译时 netlink/msg.h、lua.h 等头文件缺失。
          ./scripts/feeds update base packages luci

      - name: Inject plugin & install feeds
        shell: bash
        run: |
          set -e
          cd "$SDK_ROOT"
          if [ ! -d feeds/luci/applications ]; then
            echo "::error::未找到 feeds/luci/applications，feeds update 可能失败"
            exit 1
          fi
          # base feed 提供 rpcd/libnl-tiny/liblua/libiwinfo/ucode 等 core 源码：
          # SDK 只预编译不附源码，重编 luci-base 的 C 依赖时需要这些源码来补齐
          # staging 头(netlink/msg.h、lua.h 等)，故必须安装 base feed。
          ./scripts/feeds install -a -f -p base
          # packages feed 全量装（编译 luci-base 需要其中的依赖）
          ./scripts/feeds install -a -f -p packages
          # luci feed 只装 luci-base（提供 luci.mk 及构建依赖）；切勿 install -a！
          # 否则会装进 luci-app-attendedsysupgrade，其 select attendedsysupgrade-common
          # -> select rpcd 会与本包依赖形成 kconfig 循环依赖导致编译失败。
          ./scripts/feeds install -f luci-base
          # 把本插件放进 luci feed 的 applications/ 层，使 Makefile 里的
          # `include ../../luci.mk` 能解析到 feeds/luci/luci.mk
          rm -rf "feeds/luci/applications/$PKG_NAME"
          cp -fR "$GITHUB_WORKSPACE/$PKG_NAME" feeds/luci/applications/
          chmod +x "feeds/luci/applications/$PKG_NAME/root/etc/init.d/serverctl" 2>/dev/null || true
          chmod +x "feeds/luci/applications/$PKG_NAME/root/usr/bin/serverctl-scheduler" 2>/dev/null || true
          # scripts/feeds 的包索引基于 feeds update 时的扫描，识别不到事后手动拷入的目录，
          # 因此这里手动软链接到 package/feeds/luci/（与 scripts/feeds 生成的软链接完全等价，
          # buildroot 扫描同样能识别，且 Makefile 的相对 include 仍解析正确）。
          ./scripts/feeds install -f "$PKG_NAME" || true
          if [ ! -e "package/feeds/luci/$PKG_NAME/Makefile" ]; then
            echo "scripts/feeds 未能链接 $PKG_NAME，改为手动软链接"
            mkdir -p package/feeds/luci
            ln -snf "../../../feeds/luci/applications/$PKG_NAME" "package/feeds/luci/$PKG_NAME"
          fi
          # 硬校验：确保本包已接入 buildroot
          if [ ! -e "package/feeds/luci/$PKG_NAME/Makefile" ]; then
            echo "::error::未能将 $PKG_NAME 接入 buildroot（package/feeds/luci/$PKG_NAME 缺失）"
            ls -la feeds/luci/applications/ 2>/dev/null | head || true
            exit 1
          fi
          echo "OK: $PKG_NAME -> $(readlink -f "package/feeds/luci/$PKG_NAME")"

      - name: SSH connection to Actions
        uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113 # v3.24
        continue-on-error: true
        if: github.event.inputs.ssh == 'true'
        with:
          limit-access-to-actor: true

      - name: Compile package
        id: compile
        shell: bash
        run: |
          set -o pipefail
          cd "$SDK_ROOT"
          # 播种 .config：启用本包及其依赖，defconfig 会据此解析依赖闭包。
          # base feed 已安装，rpcd/libnl-tiny/liblua/ucode 等 core 依赖会由 rpcd-mod-luci、
          # lucihttp、luci-base 的 DEPENDS 自动纳入闭包并从源码构建、补齐 staging 头。
          # libiwinfo 仅作为 rpcd-mod-luci 的 PKG_BUILD_DEPENDS(非 DEPENDS)，需显式开启以
          # 确保其头文件先入 staging。
          {
            printf 'CONFIG_PACKAGE_luci-base=m\n'
            printf 'CONFIG_PACKAGE_etherwake=m\n'
            printf 'CONFIG_PACKAGE_sshpass=m\n'
            printf 'CONFIG_PACKAGE_openssh-client=m\n'
            printf 'CONFIG_PACKAGE_libiwinfo=m\n'
            printf 'CONFIG_PACKAGE_%s=m\n' "$PKG_NAME"
            printf 'CONFIG_PACKAGE_%s=m\n' "$I18N_PKG"
          } >> .config
          make defconfig CTL_BUILDID="$BUILD_ID" 2>&1 | tee "$GITHUB_WORKSPACE/defconfig.log"
          # 硬校验：defconfig 后本包必须被启用，否则尽早失败（避免长时间空跑）
          if ! grep -q "^CONFIG_PACKAGE_${PKG_NAME}=m" .config; then
            echo "::error::defconfig 后 ${PKG_NAME} 未被启用（依赖不满足或被剔除）"
            grep -i 'serverctl' .config || echo '(本包相关 CONFIG 全无)'
            exit 1
          fi
          # 简体中文 i18n：defconfig 后仍在 .config 中则一并编译，否则告警但保持绿色
          if grep -q "^CONFIG_PACKAGE_${I18N_PKG}=m" .config; then
            BUILD_I18N=1
            echo "will also build i18n package: ${I18N_PKG}"
          else
            BUILD_I18N=0
            echo "::warning::defconfig 后 ${I18N_PKG} 未被启用，本次仅编译主程序包"
          fi
          echo "==== $(nproc) threads compile ===="
          make package/$PKG_NAME/download -j"$(nproc)" || true
          make package/$PKG_NAME/compile CTL_BUILDID="$BUILD_ID" -j"$(nproc)" 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          if [ "$BUILD_I18N" = "1" ]; then
            echo "==== compile app+i18n in one build set (${I18N_PKG}) ===="
            # 与主包同一次 make 编译，共享 build_dir；结尾 buildroot 会对 HIDDEN 的 i18n
            # 目标再走一遍 package/<i18n>/compile 记账并 'No rule to make target' 报错，
            # 但 ipk 实际已产出，故此处 || true 吞掉收尾错误，改以“ipk 是否真实存在”判定成败。
            make package/$PKG_NAME/compile package/$I18N_PKG/compile CTL_BUILDID="$BUILD_ID" -j"$(nproc)" 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log" || true
            mkdir -p "$GITHUB_WORKSPACE/ipk"
            aipk=$(find "$SDK_ROOT/bin" -name "${PKG_NAME}_*.ipk"  | head -n1)
            iipk=$(find "$SDK_ROOT/bin" -name "${I18N_PKG}_*.ipk" | head -n1)
            if [ -z "$aipk" ] || [ -z "$iipk" ]; then
              echo "::error::合并编译后未同时产出主包与 i18n 包 (app='$aipk' i18n='$iipk')"
              echo "---- build.log tail 150 ----"; tail -n 150 "$GITHUB_WORKSPACE/build.log"
              echo "---- bin 下所有 ipk ----"; find "$SDK_ROOT/bin" -name '*.ipk' 2>/dev/null | head -n 50 || true
              exit 1
            fi
            cp -v "$aipk" "$iipk" "$GITHUB_WORKSPACE/ipk/"
            echo "IPK_DIR=$GITHUB_WORKSPACE/ipk" >> "$GITHUB_ENV"
            echo "I18N_OK=1" >> "$GITHUB_ENV"
          fi
          echo "status=success" >> "$GITHUB_OUTPUT"

      - name: Diagnose build failure
        if: failure()
        shell: bash
        run: |
          set +e
          WS="$GITHUB_WORKSPACE"
          [ -d "$SDK_ROOT" ] && cd "$SDK_ROOT"
          echo "=================== kconfig 循环依赖上下文 ==================="
          KC="tmp/.config-package.in"
          if [ -f "$KC" ]; then
            ln=$(grep -n 'recursive dependency' "$KC" | head -n1 | cut -d: -f1)
            if [ -n "$ln" ]; then
              start=$((ln-2)); [ "$start" -lt 1 ] && start=1
              sed -n "${start},$((ln+14))p" "$KC"
            else
              echo "(defconfig 阶段未发现 recursive dependency)"
            fi
          else
            echo "(未找到 $KC)"
          fi
          echo ""
          echo "=================== 相关 CONFIG 取值 ==================="
          grep -iE 'serverctl|luci-base|attendedsysupgrade|rpcd|etherwake|sshpass|openssh' .config 2>/dev/null || true
          echo ""
          echo "=================== defconfig.log 关键行 ==================="
          grep -nE 'recursive dependency|error:|Error|not satisfied' "$WS/defconfig.log" 2>/dev/null | tail -n 40 || true
          echo ""
          echo "=================== build.log 错误行 ==================="
          grep -nE 'Error [0-9]+|error:|undefined reference|No such file|command not found|not satisfied|Please (run|install)|cannot find' "$WS/build.log" 2>/dev/null | tail -n 60 || true
          echo ""
          echo "=================== build.log 末尾 120 行 ==================="
          tail -n 120 "$WS/build.log" 2>/dev/null || echo "(无 build.log，defconfig 或更早步骤即失败)"
          echo ""
          echo "=================== buildroot 失败包日志(logs/) ==================="
          echo "SDK_ROOT=$SDK_ROOT; logs 是否存在: $([ -d logs ] && echo yes || echo no)"
          echo "--- logs 目录结构(前 60 项) ---"
          find logs -type f 2>/dev/null | head -n 60 || true
          echo "--- 失败依赖包日志 ---"
          for f in $(find logs -type f \( -path '*rpcd-mod-luci*' -o -path '*lucihttp*' -o -path '*luci-base*' -o -path '*libnl-tiny*' -o -path '*lua*' -o -path '*ucode*' -o -path '*libiwinfo*' -o -path '*server-ctl*' \) 2>/dev/null); do
            echo "===== $f (tail 120) ====="
            tail -n 120 "$f"
          done
          echo ""
          echo "=================== logs/ 中关键错误 ==================="
          grep -RIn -E 'error:|Error [0-9]|CMake Error|No such file|command not found|undefined reference|is required|does not exist|missing|fatal' logs 2>/dev/null | tail -n 120 || true
          echo ""
          echo "=================== 已产出的 ipk(若有) ==================="
          find bin -name '*.ipk' 2>/dev/null | head -n 30 || true

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-logs-${{ github.run_number }}
          path: |
            defconfig.log
            build.log
          if-no-files-found: ignore

      - name: Collect .ipk
        id: collect
        if: steps.compile.outputs.status == 'success' && !cancelled()
        run: |
          mkdir -p "$GITHUB_WORKSPACE/ipk"
          found=$(find "$SDK_ROOT/bin" -name "${PKG_NAME}*.ipk" -o -name "${I18N_PKG}*.ipk")
          if [ -z "$found" ]; then
            echo "::error::编译结束但未找到 .ipk"
            find "$SDK_ROOT/bin" -name '*.ipk' | head -n 50 || true
            exit 1
          fi
          echo "$found" | xargs -I{} cp -v {} "$GITHUB_WORKSPACE/ipk/"
          echo "IPK_DIR=$GITHUB_WORKSPACE/ipk" >> "$GITHUB_ENV"
          echo "status=success" >> "$GITHUB_OUTPUT"
          ls -lh "$GITHUB_WORKSPACE/ipk"

      - name: Upload ipk as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.collect.outputs.status == 'success' && !cancelled()
        with:
          name: luci-app-server-ctl-ipk-${{ steps.ver.outputs.version }}-${{ github.run_number }}
          path: ${{ env.IPK_DIR }}
          if-no-files-found: error

  # ── release job：全流程中唯一持有 contents: write 的 job ──────────────
  # build job 以只读权限运行；.ipk 经 Actions artifact 跨 job 传递。
  # 仅当手动触发勾选了 upload_release 且 ipk 确实产出时才执行。
  release:
    needs: build
    if: github.event.inputs.upload_release == 'true' && needs.build.outputs.ipk_ok == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download ipk artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: luci-app-server-ctl-ipk-${{ needs.build.outputs.version }}-${{ github.run_number }}
          path: ipk

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ env.PKG_NAME }}-${{ needs.build.outputs.version }}-${{ github.run_number }}
          name: luci-app-server-ctl (${{ needs.build.outputs.version }})
          body: |
            由 GitHub Actions 自动编译，基于 ImmortalWrt ${{ needs.build.outputs.version }} SDK。
            构建版本号：`${{ needs.build.outputs.build_id }}`（已写入 ipk 文件名）。
            安装：`opkg install luci-app-server-ctl_*.ipk luci-i18n-server-ctl-zh-cn_*.ipk`（会自动拉取依赖 luci-base / etherwake / sshpass / openssh-client）。
            升级覆盖：如遇 opkg 提示已安装同版本而跳过，可用 `opkg install <ipk> --force-reinstall` 强制覆盖。
          files: ipk/*.ipk
